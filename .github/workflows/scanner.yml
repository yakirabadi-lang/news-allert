              response = model.generate_content(prompt,request_options={"timeout":120})
              print("gemini done")
              result_text = response.text.strip()
              if result_text != 'QUIET':
                  send_telegram(result_text)
          except Exception as e:
              print('AI error:', e)
          
          EOF
